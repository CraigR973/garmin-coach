name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches: [main]

jobs:
  lint-api:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-dev.txt
            apps/api/requirements.lock
      # Runtime packages at the versions production runs: the Docker image installs
      # requirements.lock, so CI constrains to it rather than to the latest release.
      # Unpinned, CI took SQLAlchemy 2.1.0 on 2026-09-24 while production runs 2.0.51.
      - run: |
          grep -E '^[A-Za-z0-9_.-]+==' requirements.lock | sed -E 's/[[:space:]]*\\$//' > "$RUNNER_TEMP/lock-constraints.txt"
          pip install -r requirements-dev.txt -c "$RUNNER_TEMP/lock-constraints.txt"
      - run: ruff check .
      - run: ruff format --check .

  typecheck-api:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-dev.txt
            apps/api/requirements.lock
      # Runtime packages at the versions production runs: the Docker image installs
      # requirements.lock, so CI constrains to it rather than to the latest release.
      # Unpinned, CI took SQLAlchemy 2.1.0 on 2026-09-24 while production runs 2.0.51.
      - run: |
          grep -E '^[A-Za-z0-9_.-]+==' requirements.lock | sed -E 's/[[:space:]]*\\$//' > "$RUNNER_TEMP/lock-constraints.txt"
          pip install -r requirements-dev.txt -c "$RUNNER_TEMP/lock-constraints.txt"
      - run: mypy src
        env:
          PYTHONPATH: .

  test-api:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coach_test
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL from the runner image, not a service container: the public ECR
      # mirror refused anonymous pulls ("toomanyrequests: Data limit exceeded") on
      # roughly a third of these jobs on 27 Sep 2026, failing them before a test
      # ran. ubuntu-latest ships PostgreSQL 16, the major version the container ran;
      # the step prints the server version so a runner-image upgrade is visible.
      - name: Start PostgreSQL
        timeout-minutes: 2
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb coach_test
          sudo -u postgres psql -tAc "SHOW server_version;"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-dev.txt
            apps/api/requirements.lock
      # Runtime packages at the versions production runs: the Docker image installs
      # requirements.lock, so CI constrains to it rather than to the latest release.
      # Unpinned, CI took SQLAlchemy 2.1.0 on 2026-09-24 while production runs 2.0.51.
      - run: |
          grep -E '^[A-Za-z0-9_.-]+==' requirements.lock | sed -E 's/[[:space:]]*\\$//' > "$RUNNER_TEMP/lock-constraints.txt"
          pip install -r requirements-dev.txt -c "$RUNNER_TEMP/lock-constraints.txt"
      - run: alembic upgrade head
      - run: pytest --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: .

  migration-check:
    name: Migration check (alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL from the runner image, not a service container: the public ECR
      # mirror refused anonymous pulls ("toomanyrequests: Data limit exceeded") on
      # roughly a third of these jobs on 27 Sep 2026, failing them before a test
      # ran. ubuntu-latest ships PostgreSQL 16, the major version the container ran;
      # the step prints the server version so a runner-image upgrade is visible.
      - name: Start PostgreSQL
        timeout-minutes: 2
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost -p 5432; do sleep 1; done
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb coach_migration
          sudo -u postgres psql -tAc "SHOW server_version;"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-dev.txt
            apps/api/requirements.lock
      # Runtime packages at the versions production runs: the Docker image installs
      # requirements.lock, so CI constrains to it rather than to the latest release.
      # Unpinned, CI took SQLAlchemy 2.1.0 on 2026-09-24 while production runs 2.0.51.
      - run: |
          grep -E '^[A-Za-z0-9_.-]+==' requirements.lock | sed -E 's/[[:space:]]*\\$//' > "$RUNNER_TEMP/lock-constraints.txt"
          pip install -r requirements-dev.txt -c "$RUNNER_TEMP/lock-constraints.txt"
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coach_migration
      - run: alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/coach_migration

  build-web:
    name: Build web (lint + typecheck + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
        working-directory: apps/web
      - run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm build
        working-directory: apps/web
        env:
          VITE_API_URL: https://placeholder.railway.app

  test-web:
    name: Unit tests (web + shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install
      # Recursive vitest across the JS workspaces (apps/web + packages/shared).
      # The `build-web` job only lints/typechecks/builds — without this, web unit
      # test regressions could merge green (they are not run anywhere else in CI).
      - run: pnpm -r test

  security-audit:
    name: Security audit (deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # API: audit the runtime requirements against the OSV database.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.lock --require-hashes --no-deps --disable-pip
        working-directory: apps/api
      # Web/shared: pnpm audit with explicit reviewed exceptions for currently
      # non-reachable React Router moderate advisories; any unreviewed advisory
      # or any applicable High/Critical fails the job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/audit_js_advisories.py
      - run: python scripts/check_rls_posture.py --allow-missing-url
        env:
          RLS_POSTURE_DATABASE_URL: ${{ secrets.RLS_POSTURE_DATABASE_URL }}
      # Tracked-content/history-aware secret scan. Full checkout is intentional.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
